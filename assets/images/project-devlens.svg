    <text x="65" y="228" fill="#d4c9bc" font-size="12">Simplified 4-digit biometric prompt with audio guidance for screen readers</text>

    <text x="50" y="280" fill="#d48b38">Result: 40% reduction in user drop-off during transfer verification</text>
