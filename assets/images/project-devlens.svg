  <rect width="600" height="380" rx="16" fill="url(#bgV4)" />
  <rect width="600" height="42" fill="#2b2420" opacity="0.8" rx="16" />
  <circle cx="28" cy="21" r="5" fill="#c05a3e" />
  <circle cx="46" cy="21" r="5" fill="#d48b38" />
  <circle cx="64" cy="21" r="5" fill="#4a6b57" />
  <text x="300" y="25" fill="#d4c9bc" font-size="12" font-family="Georgia, serif" text-anchor="middle">finease.design/accessibility-audit</text>

  <rect x="30" y="65" width="540" height="280" rx="10" fill="#1b1715" stroke="#3d352f" />
  <g font-family="Georgia, serif" font-size="13">
    <text x="50" y="100" fill="#d48b38">✦ Usability Evaluation & Accessibility Heuristic Scan</text>
    <text x="50" y="130" fill="#4a6b57">✓ WCAG 2.1 AA Contrast Ratio: 7.2:1 (Exceeds 4.5:1 Requirement)</text>
    <text x="50" y="155" fill="#4a6b57">✓ Touch Target Minimum: 48px × 48px on all interactive elements</text>
    
